name: Daily YouTube Scraping

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '12 3 * * *'
    - cron: '0 11 * * *'
    - cron: '30 15 * * *'
  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
   scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Puppeteer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev wget xvfb

    - name: Install npm dependencies
      run: npm install puppeteer
    
    - name: Run scraper with xvfb
      run: | 
        xvfb-run --auto-servernum node main-scrap.js
      env:
        NODE_ENV: production
      timeout-minutes: 10 # Overall step timeout

    - name: Run data uploader
      run: node data-upload.js
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    - name: Commit and push changes (if any)
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Automated data update" || echo "No changes to commit"
        git push
