name: Daily YouTube Scraping

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '12 3 * * *'
    - cron: '0 11 * * *'
    - cron: '30 15 * * *'
  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
   scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev wget xvfb gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils

    - name: Install project dependencies
      run: |
        npm install
        npm install puppeteer

    - name: Verify Puppeteer installation
      run: |
        echo "Puppeteer version: $(node -e "console.log(require('puppeteer').version)")"

    - name: Run scraper
      run: |
        xvfb-run --auto-servernum node main-scrap.js
      env:
        NODE_ENV: production
      timeout-minutes: 15

    - name: Run data uploader
      run: node data-upload.js
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    - name: Commit and push changes (if any)
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Automated data update" || echo "No changes to commit"
        git push
